version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spese-app
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: prod
      APP_DEBUG: '0'
      APP_SECRET: ${APP_SECRET:-change_me_in_production}
      # SQLite dummy — l'app non usa DB, ma Doctrine richiede la variabile
      DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data.db"
      GOOGLE_APPLICATION_CREDENTIALS: api-google-sheet-secret.json
      GOOGLE_API_KEY: ''
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
      SPREADSHEET_ID: ${SPREADSHEET_ID}
      SPREADSHEET_RANGE: ${SPREADSHEET_RANGE:-"Risposte del modulo 1!A1:G"}
      SPREADSHEET_TIPISPESE_RANGE: ${SPREADSHEET_TIPISPESE_RANGE:-TipiSpese}
    volumes:
      # Monta il file delle credenziali Google (read-only)
      - ./api-google-sheet-secret.json:/var/www/html/api-google-sheet-secret.json:ro
    restart: unless-stopped
